name: Personal Dynamic CI

on:
  push:
    branches: [personal-dynamic]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:keys
      - run: npm run check:data
      - run: npm run build

