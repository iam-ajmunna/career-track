name: Official source review
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache/restore@v4
        with:
          path: test-results/source-review/state.json
          key: source-fingerprints-${{ github.run_id }}
          restore-keys: source-fingerprints-
      - run: node scripts/research/source-review.mjs
      - uses: actions/cache/save@v4
        with:
          path: test-results/source-review/state.json
          key: source-fingerprints-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: official-source-review
          path: test-results/source-review/report.json
          retention-days: 30
