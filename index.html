<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A minimal, structured scholarship command center for fully funded MSc applications." />
  <title>MSc Scholarship Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script type="module" src="/assets/theme.js"></script>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <noscript>
    <div class="noscript">This dashboard needs JavaScript enabled to render scholarship data.</div>
  </noscript>

  <main id="authGate" class="auth-gate" aria-labelledby="authTitle">
    <section class="auth-card card">
      <div class="brand-mark" aria-hidden="true">M</div>
      <p class="eyebrow">Scholarship OS · MSc 2027</p>
      <h1 id="authTitle">Opening your workspace</h1>
      <p id="authMessage" class="auth-message" role="status" aria-live="polite">Opening saved progress…</p>
      <div class="auth-actions">
        <button type="button" id="authRetry" class="button secondary" hidden>Retry</button>
        <button type="button" id="gateExport" class="button secondary" hidden>Export saved progress</button>
      </div>
      <p class="small muted">Progress is saved in this browser.</p>
    </section>
  </main>

  <div class="app-shell" id="appShell" hidden>
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div>
          <div class="brand-title">Scholarship OS</div>
          <div class="brand-subtitle">MSc 2027 · Bangladesh</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button type="button" class="nav-item active" data-view="overview"><span>Overview</span><kbd>1</kbd></button>
        <button type="button" class="nav-item" data-view="scholarships"><span>Scholarships</span><kbd>2</kbd></button>
        <button type="button" class="nav-item" data-view="pipeline"><span>Application Pipeline</span><kbd>3</kbd></button>
        <button type="button" class="nav-item" data-view="documents"><span>Documents</span><kbd>4</kbd></button>
        <button type="button" class="nav-item" data-view="profile"><span>Profile Fit</span><kbd>5</kbd></button>
        <button type="button" class="nav-item" data-view="goal"><span>Personalized Goal</span><kbd>6</kbd></button>
      </nav>

      <div class="sidebar-footer">
        <div class="status-dot-row"><span class="status-dot"></span><span>Dataset snapshot</span></div>
        <div class="muted small">28 Sep 2026</div>
        <div class="account-actions"><button type="button" id="exportProgress" class="text-button">Export progress</button></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">Fully Funded MSc Strategy</p>
          <h1 id="pageTitle">Overview</h1>
        </div>
        <div class="topbar-actions">
          <div class="search-wrap">
            <input id="globalSearch" type="search" autocomplete="off" enterkeyhint="search" placeholder="Search scholarships, countries, funding, status..." aria-label="Search scholarships" />
            <button type="button" id="searchClear" class="search-clear" aria-label="Clear search" title="Clear search" hidden>×</button>
          </div>
          <button type="button" id="themeToggle" class="icon-button" aria-label="Switch to dark theme" title="Switch to dark theme">◐</button>
        </div>
      </header>

      <div id="syncBar" class="sync-bar" data-status="loading">
        <span id="syncLabel" role="status" aria-live="polite">Opening workspace…</span>
        <button type="button" id="syncRetry" class="text-button" hidden>Retry</button>
      </div>
      <p id="syncMessage" class="sync-message" role="status" hidden></p>
      <section id="view-overview" class="view active-view"></section>
      <section id="view-scholarships" class="view"></section>
      <section id="view-pipeline" class="view"></section>
      <section id="view-documents" class="view"></section>
      <section id="view-profile" class="view"></section>
      <section id="view-goal" class="view"></section>
    </main>
  </div>

  <dialog id="scholarshipDialog" class="dialog" aria-labelledby="scholarshipDialogTitle">
    <button type="button" class="dialog-close" id="dialogClose" aria-label="Close scholarship details">×</button>
    <div id="dialogContent"></div>
  </dialog>

  <dialog id="signOutDialog" class="dialog dialog--compact" aria-labelledby="signOutTitle" aria-describedby="signOutDescription">
    <div class="dialog-body">
      <p class="eyebrow">Pending changes</p>
      <h2 id="signOutTitle" class="dialog-title dialog-title--compact">Save before signing out</h2>
      <p id="signOutDescription" class="dialog-copy"></p>
      <div class="dialog-actions dialog-actions--end">
        <button type="button" id="signOutCancel" class="button secondary">Stay and retry</button>
        <button type="button" id="exportSignOut" class="button">Export and sign out</button>
      </div>
    </div>
  </dialog>

  <template id="toastTemplate">
    <div class="toast"></div>
  </template>

  <div id="toastRoot" class="toast-root" role="status" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
